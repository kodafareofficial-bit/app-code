name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'آدرس سرور بک‌اند (مثلاً https://api.example.com) — اگر خالی باشد از Variable به نام API_BASE_URL خوانده می‌شود'
        required: false
        type: string

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # لازم برای ساخت Release هنگام push تگ

env:
  FLUTTER_VERSION: '3.27.4'
  API_BASE_URL: ${{ github.event.inputs.api_base_url || vars.API_BASE_URL || 'http://10.0.2.2:3000' }}
  APP_LABEL: ${{ vars.APP_LABEL || 'کد آفر' }}

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run API smoke tests
        working-directory: backend
        run: npm test

  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Show build configuration
        run: |
          echo "API_BASE_URL = $API_BASE_URL"
          echo "APP_LABEL    = $APP_LABEL"
          flutter --version

      - name: Fetch Persian font
        run: bash tool/get_fonts.sh

      - name: Default logo assets
        run: |
          python3 -m pip install --quiet pillow
          python3 tool/make_logo.py

      - name: Generate Android scaffold
        run: |
          mkdir -p /tmp/keep
          cp pubspec.yaml analysis_options.yaml /tmp/keep/
          cp -r lib /tmp/keep/lib
          flutter create --platforms=android --org ir.codeoffer --project-name codeoffer --no-pub .
          cp /tmp/keep/pubspec.yaml pubspec.yaml
          cp /tmp/keep/analysis_options.yaml analysis_options.yaml
          rm -rf lib && cp -r /tmp/keep/lib lib
          rm -rf test

      - name: Patch AndroidManifest (permissions, label, links)
        run: python3 tool/patch_android.py "$API_BASE_URL" "$APP_LABEL"

      - name: Configure release signing (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=upload-keystore.jks"
            } > android/key.properties
            python3 tool/patch_signing.py
          else
            echo "::warning::KEYSTORE_BASE64 تنظیم نشده؛ APK با کلید دیباگ امضا می‌شود."
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze (informational)
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Name the APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/CodeOffer-${{ github.run_number }}.apk"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: CodeOffer-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
